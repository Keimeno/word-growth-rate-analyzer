# Everything Undercurrent needs, the same locally and in production. All of it is free and open
# source software, the only cost is the server it runs on.
#
#   docker compose up -d --build     # ClickHouse, Grafana, the web dashboard, ntfy,
#                                    # ingester and analyzer
#
# Ports are only bound to localhost. On a server, reach Grafana through an ssh tunnel
# (ssh -L 3608:localhost:3608 your-server) or put a reverse proxy with TLS in front. The
# same goes for the web dashboard (3610) and ntfy, see the README for getting alerts onto
# a phone.
name: undercurrent

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-undercurrent}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-undercurrent}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      # the web dashboard's user, which can only read (clickhouse/users.d/web.xml)
      WEB_CLICKHOUSE_PASSWORD: ${WEB_CLICKHOUSE_PASSWORD:?set WEB_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/undercurrent.xml:/etc/clickhouse-server/config.d/undercurrent.xml:ro
      - ./clickhouse/users.d/web.xml:/etc/clickhouse-server/users.d/web.xml:ro
    ports:
      - 127.0.0.1:3607:8123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.1
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/term-explorer.json
      # read by the datasource provisioning file
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-undercurrent}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-undercurrent}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3608:3000

  # The web dashboard: the page and its API. Grafana stays as the pro mode. It connects as
  # a ClickHouse user that can only read, and gets no other secrets.
  web:
    build:
      context: .
      target: web
    command: ["undercurrent", "web", "--host", "0.0.0.0"]
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-undercurrent}
      CLICKHOUSE_USER: undercurrent_web
      CLICKHOUSE_PASSWORD: ${WEB_CLICKHOUSE_PASSWORD}
      # where its "Pro mode" links go
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3608}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
    volumes:
      # the gates the explainer shows
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - 127.0.0.1:3610:3610

  ingest:
    build: .
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    # SIGTERM flushes buffered rows, give it time to finish
    stop_grace_period: 30s

  # Scores trends every 15 minutes, sends alerts and the daily digests to ntfy
  analyze:
    build: .
    command: ["undercurrent", "analyze"]
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      ntfy:
        condition: service_started
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      NTFY_URL: ${NTFY_URL:-http://ntfy}
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  # Push notifications. Self-hosted, so no account and no message limits.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    restart: unless-stopped
    environment:
      # the url phones and browsers use to reach this server
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:3609}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      # keep messages a while, so a phone that was offline still gets them
      NTFY_CACHE_DURATION: 72h
      NTFY_BEHIND_PROXY: "true"
      # iOS only gets instant notifications through ntfy.sh (free). Only a message id
      # is sent there, the phone then fetches the message from this server.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-}
    volumes:
      - ntfy_cache:/var/cache/ntfy
    ports:
      - 127.0.0.1:3609:80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/v1/health | grep -q '\"healthy\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clickhouse_data:
  grafana_data:
  ntfy_cache:
