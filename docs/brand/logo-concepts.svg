<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Four logo concepts for Undercurrent: Cascade (chosen), Threshold, Strata and Monogram">
<title>Undercurrent logo concepts</title>
<style>
  text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: #0d191c; }
  .name { font-size: 15px; font-weight: 600; }
  .why { font-size: 11.5px; fill: #515d60; }
  .cell { fill: #fcfefe; stroke: #d3dadc; }
  .chosen { stroke: #096669; stroke-width: 2; }
  .cur { fill: #096669; } .ink { fill: #0d191c; }
  .curs { stroke: #096669; fill: none; } .inks { stroke: #0d191c; fill: none; }
</style>
<rect x="0" y="0" width="960" height="300" fill="#f7fafa"/>
<!-- 1 Cascade (chosen) -->
<rect class="cell chosen" x="16" y="16" width="220" height="200" rx="6"/>
<g transform="translate(66 46) scale(5)"><rect class="cur" x="2" y="16.5" width="11" height="4.5"/><rect class="cur" x="6.5" y="9.75" width="11" height="4.5"/><rect class="cur" x="11" y="3" width="11" height="4.5"/></g>
<text class="name" x="16" y="244">1 · Cascade (chosen)</text>
<text class="why" x="16" y="264">Layers that start later, sit higher:</text>
<text class="why" x="16" y="280">rising, and spreading to the next.</text>
<!-- 2 Threshold -->
<rect class="cell" x="256" y="16" width="220" height="200" rx="6"/>
<g transform="translate(306 46) scale(5)"><path class="inks" d="M2 9H22" stroke-width="1.25"/><path class="curs" d="M3.4 17.6H9.2L15 5" stroke-width="2.8"/></g>
<text class="name" x="256" y="244">2 · Threshold</text>
<text class="why" x="256" y="264">A series breaking its threshold.</text>
<text class="why" x="256" y="280">At 16 px: a cross, a "t" or "ナ".</text>
<!-- 3 Strata -->
<rect class="cell" x="496" y="16" width="220" height="200" rx="6"/>
<g transform="translate(546 46) scale(5)"><rect class="ink" x="2" y="4" width="20" height="2"/><rect class="cur" x="2" y="9.5" width="14" height="4"/><rect class="cur" x="8" y="16.5" width="14" height="4"/></g>
<text class="name" x="496" y="244">3 · Strata</text>
<text class="why" x="496" y="264">Currents beneath a calm surface.</text>
<text class="why" x="496" y="280">Reads as a text-alignment icon.</text>
<!-- 4 Monogram -->
<rect class="cell" x="736" y="16" width="208" height="200" rx="6"/>
<g transform="translate(780 46) scale(5)"><path class="inks" d="M3 11.5H4.6M9.4 11.5H14.6M19.4 11.5H21" stroke-width="2.5"/><path class="curs" d="M7 4V13A5 5 0 0 0 17 13V2" stroke-width="2.5"/></g>
<text class="name" x="736" y="244">4 · Monogram</text>
<text class="why" x="736" y="264">A U that dives and resurfaces.</text>
<text class="why" x="736" y="280">A magnet; near UCN's letter tile.</text>
</svg>
